# nginx 反向代理样例（非容器部署）。
# 用途：静态托管前端 dist + /api 反代后端 8080 + /uploads 直接喂上传统一目录。
# 部署前请把下面的绝对路径改为实际路径：
#   <FRONTEND_DIST> —— 前端构建产物，如 /var/www/family-storage/dist
#   <UPLOAD_DIR>    —— 后端 UPLOAD_DIR 环境变量同值，如 /var/www/family-storage/uploads
# 本样例监听 80（HTTP）。对外 HTTPS 建议用 certbot 自动签发：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your.domain.example
# certbot 会自动改写本文件加入 443/ssl_certificate，并保留 80 → 443 跳转。

server {
    listen 80;
    server_name your.domain.example;   # 占位，替换为真实域名或下划线 _

    # 上传体积上限与后端 multipart 对齐（后端 5MB/文件、6MB/请求）
    client_max_body_size 6m;

    # 前端静态资源
    root /var/www/family-storage/dist;
    index index.html;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件直出（alias 目录与后端 UPLOAD_DIR 相同）
    location /uploads {
        alias /var/www/family-storage/uploads;
        access_log off;
        expires 30d;
    }
}