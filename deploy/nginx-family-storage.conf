# nginx 反向代理样例（非容器部署）。
# 用途：静态托管前端 dist + /api 反代后端 8080 + /uploads 直接喂上传统一目录。
# 部署前请把下面的绝对路径改为实际路径：
#   <FRONTEND_DIST> —— 前端构建产物，如 /var/www/family-storage/dist
#   <UPLOAD_DIR>    —— 后端 UPLOAD_DIR 环境变量同值，如 /var/www/family-storage/uploads
# 本样例监听 80（HTTP）。对外 HTTPS 建议用 certbot 自动签发：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your.domain.example
# certbot 会自动改写本文件加入 443/ssl_certificate，并保留 80 → 443 跳转。
#
# ---- 限流（code-review M3，建议启用）----
# 1) 将下面这行放入 nginx 主配置的 http { } 上下文（本文件是 server 块样例，zone 须在 http 级声明）：
#    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/s;
# 2) 取消下方 location /api/auth/ 中的 #limit_req 注释后 reload nginx 即生效：
#    10r/s 为宽松阈值，配合后端 5 次失败锁定 5 分钟的双层防护。

server {
    listen 80;
    server_name your.domain.example;   # 占位，替换为真实域名或下划线 _

    # 上传体积上限与后端 multipart 对齐（后端 5MB/文件、6MB/请求）
    client_max_body_size 6m;

    # 前端静态资源
    root /var/www/family-storage/dist;
    index index.html;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 认证接口限流（M3）：登录/注册公开可达，先做 nginx 层粗粒度限流，
    # 后端另有按「用户名|IP」5 次失败锁定 5 分钟的细粒度防护。
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 启用前：先把上面的 limit_req_zone 放入 http { }，再取消下行注释：
        # limit_req zone=auth_login burst=10 nodelay;
    }

    # 上传文件直出（alias 目录与后端 UPLOAD_DIR 相同）
    location /uploads {
        alias /var/www/family-storage/uploads;
        access_log off;
        expires 30d;
        # M5：禁止浏览器 MIME 嗅探（配合后端魔数校验，杜绝把图片响应解析为
        # HTML/脚本的存储型 XSS 路径）；CSP 作为纵深防御，若该 URL 被直接
        # 导航访问也不执行任何页面脚本（图片 <img> 引用不受影响）。
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'none'";
    }
}