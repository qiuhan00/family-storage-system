# 生产环境配置（--spring.profiles.active=prod）。
# 真相源为环境变量：真实值一律通过启动环境注入，禁止写死到本文件/仓库。
# 示例：deploy/start.sh、.env.example。
server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/family_storage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    # 生产必须由环境变量 JWT_SECRET 注入强随机密钥（>=32 字节），与 DB_PASSWORD 一致：
    # 无默认值 —— 缺失时 Spring 解析占位符失败、应用直接拒绝启动（快速失败）。
    # 严禁提供任何兜底值：仓库内可读的默认密钥 = 公开伪签密钥，等于把系统交由攻击者托管。
    # 生成示例（>=32 字节）：openssl rand -base64 48
    secret: ${JWT_SECRET}
    expire-hours: 168
  upload-dir: ${UPLOAD_DIR:./uploads}

# 通知扩展点：生产默认关闭，开启需接入短信厂商凭据（环境变量注入）。
sms:
  enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html